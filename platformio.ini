; Tracraft Dash Round
; Плата: LilyGo T-Display-S3-AMOLED 1.75", 466x466 QSPI, драйвер CO5300.
; Панель H0175Y003AM, тач CST9217 (I2C), RTC PCF8563, зарядник SY6970.
;
; ВНИМАНИЕ по драйверу. В карточке товара LilyGo для 1.75" указан SH8601,
; но их собственный components/private_library/pin_config.h говорит иное:
;     H0175Y003AM  // 1.75 inches (CO5300 CST9217)
;     DO0143FAT01  // 1.43 inches (SH8601 FT3168)
; SH8601 стоит на версии 1.43", у нас CO5300. Проверено и по examples/GFX.ino:
; для H0175Y003AM там создаётся Arduino_CO5300 с col_offset1 = 6.
; Если экран останется чёрным — собрать env:dash_sh8601.
; Профиля этой платы в реестре PlatformIO нет, поэтому берём esp32-s3-devkitc-1
; и задаём память/разделы вручную.
;
; Платформа: форк pioarduino — Arduino core 3.x / IDF 5.5.
;   ОФИЦИАЛЬНАЯ platformio/espressif32 НЕ подходит даже в 7.1.0: она всё ещё
;   тянет framework-arduinoespressif32 @ 3.20017 = Arduino core 2.0.17.
;   Проверено сборкой. Core 3.x в официальной платформе просто нет,
;   поэтому и существует форк pioarduino.
;   Нужен именно core 3.x: GFX >= 1.5.0 инклюдит esp32-hal-periman.h и
;   esp_private/periph_ctrl.h — это его API. На core 2.0.17 GFX не собирается.
;   Драйверы SH8601/CO5300 появились в GFX только с 1.5.x, в 1.4.9 их НЕТ.
;   LilyGo свои примеры собирает под IDF 5.4, здесь 5.5 — близко.
;
; partitions.csv — только ASCII: PlatformIO читает его кодеком системной
; локали (cp1252 на Windows), кириллица в комментариях ломает сборку.

[platformio]
default_envs = dash

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions.csv
board_build.filesystem = littlefs

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, colorize
upload_speed = 921600

build_flags =
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DCORE_DEBUG_LEVEL=3
	-DLV_CONF_INCLUDE_SIMPLE
	-I include
	-std=gnu++17
build_unflags = -std=gnu++11

lib_deps =
	moononournation/GFX Library for Arduino@^1.6.0
	bblanchon/ArduinoJson@^7.2.0
;	Тач CST9217: своего драйвера у Arduino_DriveBus нет (только FT3x68,
;	CST816x, CST2xxSE), а SensorLib от того же автора его поддерживает
;	классом TouchDrvCST92xx — именно её LilyGo использует в примерах.
	lewisxhe/SensorLib@^0.2.0
; Добавляем по мере реализации слоёв:
;	esp32async/ESPAsyncWebServer@^3.7.0     HTTP + WebSocket
;	adafruit/Adafruit ADS1X15@^2.5.0        аналоговые входы (PST-F, NTC)
;	adafruit/Adafruit MCP9600 Library@^2.0.0  термопара EGT

[env:dash]
build_src_filter = +<*> -<proto/>

; Резервное окружение: та же прошивка, но с драйвером SH8601.
; Нужно только если dash даёт чёрный экран (значит карточка товара права).
[env:dash_sh8601]
build_src_filter = +<*> -<proto/>
build_flags =
	${env.build_flags}
	-DPANEL_SH8601
